<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaliTracker & NutriEats</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Ikony -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Navigace -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-500 text-slate-900 p-2 rounded-lg">
                    <i class="fa-solid font-bold fa-dumbbell text-xl"></i>
                </div>
                <h1 class="text-xl font-bold tracking-wide">CaliTracker</h1>
            </div>
            <nav class="flex space-x-1 sm:space-x-2 text-xs sm:text-sm">
                <button onclick="switchTab('program')" id="tab-btn-program" class="px-3 py-2 rounded-lg font-semibold transition bg-brand-500 text-slate-900">
                    <i class="fa-solid fa-calendar-days mr-1"></i> Plán
                </button>
                <button onclick="switchTab('tracker')" id="tab-btn-tracker" class="px-3 py-2 rounded-lg font-medium transition text-slate-400 hover:text-white hover:bg-slate-700">
                    <i class="fa-solid fa-chart-line mr-1"></i> Záznamník & Cviky
                </button>
                <button onclick="switchTab('nutrition')" id="tab-btn-nutrition" class="px-3 py-2 rounded-lg font-medium transition text-slate-400 hover:text-white hover:bg-slate-700">
                    <i class="fa-solid fa-utensils mr-1"></i> Výživa & Makra
                </button>
            </nav>
        </div>
    </header>

    <!-- Hlavní Obsah -->
    <main class="flex-grow max-w-5xl w-full mx-auto p-4 space-y-6">

        <!-- ================= Záložka 1: TRÉNINKOVÝ PLÁN (EDITOVATELNÝ) ================= -->
        <section id="tab-program" class="space-y-6">
            <div class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-lg flex flex-col sm:flex-row justify-between sm:items-center gap-4">
                <div>
                    <h2 class="text-2xl font-bold text-white flex items-center">
                        <i class="fa-solid fa-fire text-amber-500 mr-2"></i> Můj Tréninkový Plán
                    </h2>
                    <p class="text-slate-400 text-sm mt-1">Sestav a upravuj si vlastní tréninkové cykly, cviky, série a opakování.</p>
                </div>
                <div>
                    <button onclick="toggleProgramEditMode()" id="edit-program-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2 rounded-lg text-sm transition flex items-center">
                        <i class="fa-solid fa-pen-to-square mr-2"></i> Upravit Plán
                    </button>
                </div>
            </div>

            <!-- Kontejner pro dynamický tréninkový plán -->
            <div id="program-container" class="space-y-6"></div>

            <!-- Tlačítko pro přidání nového bloku/týdne v režimu úprav -->
            <div id="add-week-container" class="hidden text-center">
                <button onclick="addWeek()" class="bg-slate-800 hover:bg-slate-700 border border-dashed border-slate-600 text-slate-300 font-bold px-6 py-3 rounded-xl transition text-sm">
                    <i class="fa-solid fa-plus mr-2 text-brand-500"></i> Přidat Nový Tréninkový Blok/Týden
                </button>
            </div>
        </section>


        <!-- ================= Záložka 2: ZÁZNAMNÍK & GRAF CVIKŮ ================= -->
        <section id="tab-tracker" class="space-y-6 hidden">

            <!-- Osobní Rekordy (PRs - Dynamické) -->
            <div>
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Osobní Rekordy (PRs)</h3>
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3" id="prs-container">
                    <!-- Dynamicky vložené PR karty -->
                </div>
            </div>

            <!-- Formulář pro Přidání / Úpravu Záznamu -->
            <div class="bg-slate-800 rounded-xl p-5 border border-slate-700" id="exercise-form-card">
                <h3 class="text-lg font-bold text-white mb-4 flex items-center" id="exercise-form-title">
                    <i class="fa-solid fa-plus-circle text-brand-500 mr-2"></i> Zapsat Výkon Cviku
                </h3>
                <form id="add-log-form" class="grid sm:grid-cols-2 md:grid-cols-5 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Datum</label>
                        <input type="date" id="input-date" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Cvik</label>
                        <select id="input-exercise-select" onchange="handleExerciseSelectChange()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-500">
                            <!-- Možnosti generovány z historie + volba Nový cvik -->
